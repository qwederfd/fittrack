<script>

function suggestK(){const p=S.p,w=S.wt.length?S.wt[S.wt.length-1].w:p.w0;const bmr=10*w+6.25*p.h-5*p.age+(p.sex==="male"?5:-161);return Math.max(p.sex==="male"?1800:1400,Math.round(bmr*p.act-(p.age>=18?500:0)))}

 if(!sb||!uid)return;clearTimeout(tmr);tmr=setTimeout(push,700)}

 const last=L[L.length-1];const ok=last.sets.length>=2&&last.sets.every(s=>s[1]>=12);

function render(){if(!uid){$("nav").innerHTML="";$("app").innerHTML=authView();return}if(!S.ok){$("nav").innerHTML="";$("app").innerHTML=onb();return}

function home(){const d=TODAY(),T=tot(d),k=kt(),lost=S.p.w0-cur(),rem=cur()-S.p.tw;

function food(){const d=TODAY(),T=tot(d);
 const meals=["Breakfast","Lunch","Dinner","Snacks"];

 <label>Meal</label><select id="fm">${meals.map(m=>`<option>${m}</option>`).join("")}</select>
 <button style="margin-top:10px;width:100%" onclick="addFood()">Add</button>
 <div class="mu" style="margin-top:8px">Enter values from the label or your own estimate. Photo and barcode scanning aren’t in this version.</div></div>
 ${meals.map(m=>{const L=day(d).map((f,i)=>({f,i})).filter(x=>x.f.m===m);return L.length?`<h2>${m}</h2><div class="card">${L.map(x=>`<div class="item"><span>${esc(x.f.n)}<br><span class="mu">${Math.round(x.f.k)} kcal · ${Math.round(x.f.p)}g protein</span></span><button class="x" onclick="delFood(${x.i})">✕</button></div>`).join("")}</div>`:""}).join("")}`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function addFood(){const n=$("fn").value.trim(),k=+$("fk").value;if(!n||!(k>=0)||$("fk").value==="")return;
 (S.food[TODAY()]=S.food[TODAY()]||[]).push({n,k,p:+$("fp").value||0,c:+$("fc").value||0,f:+$("ff").value||0,m:$("fm").value});save();render()}
function delFood(i){S.food[TODAY()].splice(i,1);save();render()}
function train(){const W=wk==="A"?WA:WB;
 return `<h1>Workouts</h1><div class="row"><button class="${wk==="A"?"":"g"}" onclick="wk='A';render()">Workout A</button><button class="${wk==="B"?"":"g"}" onclick="wk='B';render()">Workout B</button></div>
 ${W.map((e,i)=>`<div class="card"><b>${e[0]}</b> <span class="pill">${e[1]} × ${e[2]}</span><div class="mu" style="margin:4px 0 8px">${esc(suggestion(e[0]))}</div>
 <div class="row"><input id="w${i}" type="number" inputmode="decimal" placeholder="kg"><input id="r${i}" type="number" inputmode="numeric" placeholder="reps/secs"><button onclick="addSet(${i})">Log set</button></div>
 <div id="s${i}" class="mu" style="margin-top:6px">${todaySets(e[0])}</div></div>`).join("")}
 <div class="card"><div class="row"><button class="g" onclick="rest(90)">Rest 90s</button><button class="g" onclick="rest(120)">Rest 2m</button></div><div id="rt" class="big" style="text-align:center"></div></div>`}
function todaySets(n){const e=(S.log[n]||[]).find(x=>x.d===TODAY()&&x.w===wk);return e?e.sets.map(s=>s[0]+"kg×"+s[1]).join(" · "):""}
let rI;function rest(s){clearInterval(rI);let t=s;const el=$("rt");el.textContent=t;rI=setInterval(()=>{t--;const e=$("rt");if(!e){clearInterval(rI);return}e.textContent=t>0?t:"Go!";if(t<=0)clearInterval(rI)},1000)}
function addSet(i){const W=wk==="A"?WA:WB,n=W[i][0],w=+$("w"+i).value||0,r=+$("r"+i).value;if(!r)return;
 const L=S.log[n]=S.log[n]||[];let e=L.find(x=>x.d===TODAY()&&x.w===wk);if(!e){e={d:TODAY(),w:wk,sets:[]};L.push(e)}e.sets.push([w,r]);save();

 const pr=Object.entries(S.log).map(([n,L])=>{let b=0;L.forEach(e=>e.sets.forEach(s=>{b=Math.max(b,e1rm(s[0],s[1]))}));return[n,b]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 return `<h1>Progress</h1><div class="card"><label>Today’s weight (kg)</label><div class="row"><input id="nw" type="number" step="0.1" inputmode="decimal"><button onclick="addW()">Save</button></div></div>

function chart(){const w=S.wt.slice(-30);if(w.length<2)return"";const v=w.map(x=>x.w),mn=Math.min(...v)-1,mx=Math.max(...v)+1;
 const pts=v.map((y,i)=>`${i/(v.length-1)*300},${80-(y-mn)/(mx-mn)*70}`).join(" ");
 return `<svg viewBox="0 0 300 84" style="width:100%;margin-top:8px"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${pts}"/></svg>`}
function addW(){const v=+$("nw").value;if(!v)return;const d=TODAY(),i=S.wt.findIndex(x=>x.d===d);if(i>=0)S.wt[i].w=v;else S.wt.push({d,w:v});S.wt.sort((a,b)=>a.d<b.d?-1:1);save();render()}
function ctx(){const d=TODAY(),days=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-i);return x.toISOString().slice(0,10)});

 return JSON.stringify({profile:S.p,targets:{kcal:kt(),protein:S.t.p},today:tot(d),last7DayAvgIntake:{kcal:Math.round(wkAvg.reduce((s,t)=>s+t.k,0)/n),protein:Math.round(wkAvg.reduce((s,t)=>s+t.p,0)/n),daysLogged:wkAvg.length},weights:S.wt.slice(-21),currentWeight:cur(),memory:S.noMem?[]:S.mem.map(m=>m.t),habitsToday:S.hab[TODAY()]||{},measurements:S.meas.slice(-3),strength:Object.fromEntries(Object.entries(S.log).map(([k,v])=>[k,v.slice(-4)]))})}
function coach(){return `<h1>AI coach</h1><div class="card" id="chatlog" style="max-height:52vh;overflow:auto">${chat.length?chat.map(m=>`<div class="item" style="display:block"><span class="pill">${m.r==="user"?"You":"Coach"}</span><div class="msg">${esc(m.c)}</div>${m.r==="ai"&&m.c.length>25?fbRow(m.c.slice(0,60),1):""}</div>`).join(""):'<span class="mu">Ask about today’s food, your training, or your progress. The coach only sees what you’ve logged in this app.</span>'}</div>
 <div class="row"><button class="g" onclick="ask('What should I eat today to hit my remaining calories and protein? Keep it cheap and low on vegetables.')">What to eat</button><button class="g" onclick="ask('Review my progress this week and tell me what to improve.')">Weekly review</button></div>

async function ask(t){const q=t||$("q").value.trim();if(!q||busy)return;
 sample=await getS();if(!sample){chat.push({r:"user",c:q},{r:"ai",c:"AI features are coming in the next phase. Everything else works now."});render();return}
 chat.push({r:"user",c:q},{r:"ai",c:"Thinking…"});busy=true;render();
 const hist=chat.slice(0,-1).slice(-8).map(m=>`${m.r==="user"?"User":"Coach"}: ${m.c}`).join("\n");
 const sys="You are a careful fitness and nutrition coach for one person. Use ONLY the JSON data below as their records; never invent logs. If data is missing, say so. Explain your reasoning briefly. Never recommend crash diets, under ~1800 kcal for an adult male, excessive training or high supplement doses; don't diagnose. Any change to calorie targets, weight goals or training must be framed as a suggestion for the user to approve. Be concise, British English, prices in £.\nDATA: "+ctx()+"\nCONVERSATION:\n"+hist+"\nReply as Coach.";
 try{const r=await sample(sys,{cache:false,onText:({text})=>{chat[chat.length-1].c=text;const l=$("chatlog");if(tab==="coach"&&l){render()}}});chat[chat.length-1].c=r.text}

function me(){const p=S.p;const f=(l,k,t="number",o="")=>`<div><label>${l}</label><input type="${t}" ${o} value="${p[k]}" onchange="setP('${k}',this.value)"></div>`;

 <div class="row"><div><label>Sex</label><select onchange="setP('sex',this.value)"><option value="male" ${p.sex==="male"?"selected":""}>Male</option><option value="female" ${p.sex==="female"?"selected":""}>Female</option></select></div>
 <div><label>Activity</label><select onchange="setP('act',this.value)">${[[1.2,"Sedentary"],[1.375,"Light"],[1.55,"Moderate"],[1.725,"Very active"]].map(a=>`<option value="${a[0]}" ${p.act==a[0]?"selected":""}>${a[1]}</option>`).join("")}</select></div></div>
 ${f("Weekly food budget £","budget")}</div>

function more(){const L=[["plan","Meal plan & recipes"],["shop","Shopping list & budget"],["scan","AI food scan"],["habits","Supplements & habits"],["body","Body measurements"],["mem","What the AI has learned"],["me","Profile & targets"]];return `<h1>More</h1>`+L.map(l=>`<button class="mb" onclick="go('${l[0]}')"><span>${l[1]}</span><span>›</span></button>`).join("")+`<div class="mu">Not in this version: family groups, barcode scanning, push notifications. Your data is saved to the account you’re signed in with, so each person should open this link in their own account.</div>`}
async function getS(){return null}
function fbRow(t,c){FT.push(t);const i=FT.length-1,B=(k,l)=>`<button class="g" style="padding:4px 10px;min-height:0" onclick="fb('${k}',${i})">${l}</button>`;return `<div class="row" style="margin-top:6px">${c?B("help","👍 Helpful")+B("nohelp","👎 Not helpful"):B("like","👍 Like")+B("dislike","👎 Dislike")+B("exp","£ Too dear")+B("diff","↻ Different")}</div>`}
function fb(k,i){const t=FT[i];S.fb.push({k,t,d:TODAY()});const P={like:"Likes: ",dislike:"Dislikes: ",exp:"Too expensive: "}[k];if(P&&!S.noMem&&!S.mem.some(m=>m.t===P+t))S.mem.push({t:P+t,src:"inferred"});save();sy("feedback saved")}
async function genPlan(){const s=await getS();if(!s){pmsg="AI features are coming in the next phase.";render();return}
 pmsg="Generating…";render();const mem=S.noMem?[]:S.mem.map(m=>m.t);
 try{const r=await s.json(`Create 7 dinners (Mon–Sun) for a UK person. Their whole weekly food budget is £${S.p.budget}, so the 7 dinners should total about £${Math.round(S.p.budget*0.55)}. Daily target ${kt()} kcal, ${S.t.p} g protein; dislikes most vegetables; reuse ingredients across meals. Honour these notes: ${JSON.stringify(mem)}. Recent feedback: ${JSON.stringify(S.fb.slice(-15))}. Prices are rough UK estimates, not live. Return ONLY JSON: {"meals":[{"day":"Mon","name":"","kcal":0,"protein":0,"cost":0,"ingredients":[{"n":"","qty":"","price":0}],"steps":[""]}]}`,{cache:false});S.plan=r.meals||[];buildShop();pmsg=""}catch(e){pmsg="Couldn’t generate ("+(e.code||"error")+"). Needs internet."}
 save();render()}
function buildShop(){const m={};S.plan.forEach(x=>(x.ingredients||[]).forEach(i=>{const k=String(i.n).toLowerCase();m[k]=m[k]||{n:i.n,q:[],pr:0,done:false};m[k].q.push(i.qty);m[k].pr+=+i.price||0}));S.shop=Object.values(m).map(x=>({n:x.n,q:x.q.join(" + "),pr:Math.round(x.pr*100)/100,done:false}))}
function plan(){return `${back()}<h1>Meal plan</h1><button style="width:100%" onclick="genPlan()">${S.plan.length?"Regenerate":"Generate"} 7-day plan</button><div class="mu">${pmsg||"Uses your targets, budget and feedback. Costs are estimates, not live prices."}</div>`+S.plan.map((m,i)=>`<div class="card"><b>${esc(m.day)}: ${esc(m.name)}</b><div class="mu">${m.kcal} kcal · ${m.protein}g protein · est. £${fmt(m.cost)}</div><details><summary class="mu">Ingredients & method</summary>${(m.ingredients||[]).map(x=>`<div class="mu">• ${esc(x.qty)} ${esc(x.n)}</div>`).join("")}<ol class="mu">${(m.steps||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details><div class="row"><button class="g" onclick="mealToDiary(${i})">Add to diary</button></div>${fbRow(m.name)}</div>`).join("")}
function mealToDiary(i){const m=S.plan[i];(S.food[TODAY()]=S.food[TODAY()]||[]).push({n:m.name,k:+m.kcal||0,p:+m.protein||0,c:0,f:0,m:"Dinner"});save();sy("added to diary")}
function shop(){const t=S.shop.reduce((a,x)=>a+(+x.pr||0),0);return `${back()}<h1>Shopping list</h1><div class="card"><div class="big">£${fmt(t)}</div><div class="mu">of £${S.p.budget} weekly budget (estimates; edit to actual price)</div>${prog(t,S.p.budget)}</div>`+(S.shop.length?`<div class="card">${S.shop.map((x,i)=>`<div class="item"><label style="margin:0;color:var(--tx);flex:1"><input type="checkbox" style="width:auto" ${x.done?"checked":""} onchange="S.shop[${i}].done=this.checked;save()"> ${esc(x.n)} <span class="mu">${esc(x.q)}</span></label><input type="number" step="0.01" style="width:80px" value="${x.pr}" onchange="S.shop[${i}].pr=+this.value;save();render()"></div>`).join("")}</div>`:`<div class="mu">Generate a meal plan first.</div>`)}
async function doScan(){const f=$("sf").files[0],mode=$("sm").value;if(!f){scanMsg="Choose a photo first.";render();return}
 const s=await getS();let lim=null;try{lim=s&&await s.limits()}catch(e){}if(!lim||!lim.images){scanMsg="Image analysis isn’t available here. Use manual entry in Food.";render();return}
 scanMsg="Analysing…";render();
 try{const r=await s.json((mode==="meal"?"Identify each food in this meal photo, estimate the portion eaten, and give nutrition for that portion. ":"Read this nutrition label and give values for one serving. ")+"Rate conf as low, medium or high. Never guess unreadable values. Return ONLY JSON: {\"items\":[{\"n\":\"\",\"k\":0,\"p\":0,\"c\":0,\"f\":0,\"conf\":\"\"}]}",{images:[f],cache:false});scanR=r.items||[];scanMsg=scanR.length?"":"Nothing identified."}catch(e){scanMsg="Scan failed ("+(e.code||"error")+"). Use manual entry."}
 render()}
function scan(){const I=(i,k,l)=>`<div><label>${l}</label><input type="number" value="${scanR[i][k]}" onchange="scanR[${i}].${k}=+this.value"></div>`;return `${back()}<h1>AI food scan</h1><div class="card"><select id="sm"><option value="meal">Meal photo</option><option value="label">Nutrition label</option></select><input id="sf" type="file" accept="image/*" capture="environment" style="margin-top:8px"><button style="margin-top:8px;width:100%" onclick="doScan()">Analyse</button><div class="mu">${scanMsg||"Needs internet. Results are AI estimates: check and edit before adding."}</div></div>`+(scanR||[]).map((f,i)=>`<div class="card"><input value="${esc(f.n)}" onchange="scanR[${i}].n=this.value"><div class="mu">Estimate · confidence ${esc(f.conf||"?")}</div><div class="row">${I(i,"k","kcal")}${I(i,"p","P g")}${I(i,"c","C g")}${I(i,"f","F g")}</div><button style="margin-top:8px" onclick="scanAdd(${i})">Add to diary</button></div>`).join("")}
function scanAdd(i){const f=scanR[i];(S.food[TODAY()]=S.food[TODAY()]||[]).push({n:f.n,k:+f.k||0,p:+f.p||0,c:+f.c||0,f:+f.f||0,m:"Snacks"});save();sy("added to diary")}
function hb(){return S.hab[TODAY()]=S.hab[TODAY()]||{water:0,sleep:"",steps:"",c:false,w:false}}
function hset(k,v){hb()[k]=v;save();render()}
function habits(){const h=hb();return `${back()}<h1>Habits & supplements</h1><div class="card"><b>Water</b> <span class="mu">${h.water} / 2500 ml</span>${prog(h.water,2500)}<button onclick="hset('water',hb().water+250)">+250 ml</button></div><div class="card"><div class="row"><div><label>Sleep (hours)</label><input type="number" step="0.5" value="${h.sleep}" onchange="hset('sleep',+this.value)"></div><div><label>Steps</label><input type="number" value="${h.steps}" onchange="hset('steps',+this.value)"></div></div></div><div class="card"><div class="row"><label style="color:var(--tx)"><input type="checkbox" style="width:auto" ${h.c?"checked":""} onchange="hset('c',this.checked)"> Creatine</label><input type="number" value="${S.sup.c}" onchange="S.sup.c=+this.value;save();render()"><span class="mu">g</span></div><div class="row"><label style="color:var(--tx)"><input type="checkbox" style="width:auto" ${h.w?"checked":""} onchange="hset('w',this.checked)"> Whey</label><input type="number" value="${S.sup.w}" onchange="S.sup.w=+this.value;save();render()"><span class="mu">g</span></div>${S.sup.c>10?'<div class="mu" style="color:#e5a04a">That creatine dose is above typical use (3–5 g/day). Check with a pharmacist or doctor.</div>':'<div class="mu">Typical creatine dose is 3–5 g daily.</div>'}</div>`}
function body(){const I=(k,l)=>`<div><label>${l} cm</label><input id="m${k}" type="number" step="0.1" inputmode="decimal"></div>`;return `${back()}<h1>Measurements</h1><div class="card"><div class="row">${I("waist","Waist")}${I("chest","Chest")}</div><div class="row">${I("arms","Arms")}${I("legs","Legs")}</div><button style="margin-top:8px;width:100%" onclick="addM()">Save</button><div class="mu">Progress photos aren’t stored in this version.</div></div><div class="card">${S.meas.slice().reverse().map(m=>`<div class="item"><span>${m.d}</span><span class="mu">W ${m.waist||"–"} · C ${m.chest||"–"} · A ${m.arms||"–"} · L ${m.legs||"–"}</span></div>`).join("")||'<span class="mu">No entries yet.</span>'}</div>`}
function addM(){const m={d:TODAY()};["waist","chest","arms","legs"].forEach(k=>m[k]=+$("m"+k).value||0);S.meas.push(m);save();render()}
function mem(){return `${back()}<h1>What the AI has learned</h1><div class="card"><label style="color:var(--tx)"><input type="checkbox" style="width:auto" ${S.noMem?"":"checked"} onchange="S.noMem=!this.checked;save()"> Use personalisation</label></div><div class="card">${S.mem.map((m,i)=>`<div class="item"><span>${esc(m.t)} <span class="pill">${m.src==="told"?"you told me":"inferred, unconfirmed"}</span></span><button class="x" onclick="S.mem.splice(${i},1);save();render()">✕</button></div>`).join("")||'<span class="mu">Nothing yet. Feedback on meals and coach replies appears here.</span>'}</div><div class="card"><label>Tell the AI something (e.g. I can’t eat dairy)</label><div class="row"><input id="mt"><button style="flex:0 0 auto" onclick="if($('mt').value.trim()){S.mem.push({t:$('mt').value.trim(),src:'told'});save();render()}">Add</button></div></div><button class="g" onclick="if(confirm('Reset all learned preferences?')){S.mem=[];S.fb=[];save();render()}">Reset personalisation</button>`}
function onb(){const I=(l,id,t="number",o="")=>`<div><label>${l}</label><input id="${id}" type="${t}" ${o} inputmode="${t==="number"?"decimal":"text"}"></div>`;return `<h1>Welcome 👋</h1><div class="mu" style="margin-bottom:12px">Tell us about you to personalise your targets. You can change everything later. Your data is saved to your own account.</div><div class="card">${I("Name","on","text")}<div class="row">${I("Age","oa")}${I("Height cm","oh")}</div><div class="row">${I("Weight kg","ow","number",'step="0.1"')}${I("Goal weight kg","ot","number",'step="0.1"')}</div><label>Sex</label><select id="os"><option value="male">Male</option><option value="female">Female</option></select><label>Activity</label><select id="oc"><option value="1.2">Sedentary</option><option value="1.375">Light</option><option value="1.55" selected>Moderate</option><option value="1.725">Very active</option></select>${I("Weekly food budget £","ob")}<div id="oe" class="mu" style="color:#e5a04a;margin-top:6px"></div><button style="width:100%;margin-top:12px" onclick="onbDone()">Get started</button></div>`}
function onbDone(){const g=i=>$(i).value,n=i=>parseFloat(g(i));const a=n("oa"),h=n("oh"),w=n("ow"),t=n("ot"),b=n("ob");
 if(!(a>=13&&a<=100&&h>=100&&h<=230&&w>=30&&w<=300&&t>=30&&t<=300&&b>=0)){$("oe").textContent="Please fill in every number with sensible values (age 13+).";return}
 S.p={name:g("on").trim(),age:a,sex:g("os"),h,w0:w,tw:t,act:+g("oc"),budget:b};S.ok=true;save();render()}
render();
let uid=null,sb=null,authMsg="";
function authView(){return `<h1>FitTrack</h1><div class="card"><label>Email</label><input id="ae" type="email" autocomplete="email"><label>Password</label><input id="ap" type="password" autocomplete="current-password"><div class="mu" style="color:#e5a04a;margin:6px 0">${esc(authMsg)}</div><button style="width:100%" onclick="auth('in')">Sign in</button><div class="row" style="margin-top:8px"><button class="g" onclick="auth('up')">Create account</button><button class="g" onclick="auth('reset')">Forgot password</button></div></div><div class="mu">Your data is private to your account.</div>`}
async function auth(m){const e=$("ae").value.trim(),p=$("ap").value;if(!sb){authMsg="Backend not set up yet (see README).";render();return}
 authMsg="";try{let r;const back=location.origin+location.pathname;
  if(m==="in")r=await sb.auth.signInWithPassword({email:e,password:p});
  else if(m==="up"){r=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:back}});if(!r.error&&!r.data.session)authMsg="Check your email to confirm, then sign in."}
  else{r=await sb.auth.resetPasswordForEmail(e,{redirectTo:back});if(!r.error)authMsg="If that email has an account, a reset link is on its way."}
  if(r.error)authMsg=r.error.message}catch(x){authMsg="Network problem. Try again."}
 render()}
async function pull(){try{if(localStorage.getItem("ft2_owner")!==uid){S=def();localStorage.setItem("ft2_owner",uid)}}catch(e){}
 try{const {data,error}=await sb.from("user_state").select("state").eq("user_id",uid).maybeSingle();if(error)throw error;
  if(data&&data.state&&Object.keys(data.state).length&&(data.state.u||0)>(S.u||0)){S=Object.assign(def(),data.state);try{localStorage.setItem("ft2",JSON.stringify(S))}catch(e){}sy("synced")}else push()}catch(e){sy("offline: saved on this phone")}}
async function push(){if(!sb||!uid)return;try{const {error}=await sb.from("user_state").upsert({user_id:uid,state:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()});if(error)throw error;sy("synced")}catch(e){sy("will sync when online")}}
async function signOut(){try{await sb.auth.signOut()}catch(e){}S=def();try{localStorage.removeItem("ft2");localStorage.removeItem("ft2_owner")}catch(e){}uid=null;render()}
async function boot(){if(!window.supabase||SB_URL.startsWith("PASTE")){authMsg="Setup needed: add your Supabase URL and key (see README).";render();return}
 sb=supabase.createClient(SB_URL,SB_KEY);
 sb.auth.onAuthStateChange(async(ev,ses)=>{if(ev==="PASSWORD_RECOVERY"){const p=prompt("Enter a new password");if(p){const r=await sb.auth.updateUser({password:p});if(r.error)alert(r.error.message)}}
  const nu=ses?ses.user.id:null;if(nu&&nu!==uid){uid=nu;await pull();render()}else if(!nu&&uid&&ev==="SIGNED_OUT"){uid=null;render()}});
 try{const {data}=await sb.auth.getSession();if(data.session){uid=data.session.user.id;await pull()}}catch(e){}render()}
boot();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
